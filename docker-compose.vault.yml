# =============================================================================
# MasterFabric - HashiCorp Vault Integration (Optional)
# =============================================================================
# Purpose: Secrets management için Vault entegrasyonu
# Usage: docker compose -f docker-compose.yml -f docker-compose.vault.yml up
# =============================================================================

services:
  # ==========================================================================
  # VAULT SERVICES
  # ==========================================================================

  vault:
    image: hashicorp/vault:1.15
    container_name: masterfabric-vault
    hostname: vault
    ports:
      - "${VAULT_PORT:-8200}:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_ROOT_TOKEN:-masterfabric-root-token}
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_ADDR: "http://0.0.0.0:8200"
      VAULT_API_ADDR: "http://0.0.0.0:8200"
    volumes:
      - vault_data:/vault/data
      - vault_logs:/vault/logs
      - ./scripts/vault-init.sh:/vault/init.sh:ro
    cap_add:
      - IPC_LOCK
    networks:
      - masterfabric-network
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true

  # ==========================================================================
  # SERVICE UPDATES FOR VAULT
  # ==========================================================================

  core-service:
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN:-${VAULT_ROOT_TOKEN:-masterfabric-root-token}}
    depends_on:
      vault:
        condition: service_healthy

  api-gateway:
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN:-${VAULT_ROOT_TOKEN:-masterfabric-root-token}}
    depends_on:
      vault:
        condition: service_healthy

  provisioning-service:
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN:-${VAULT_ROOT_TOKEN:-masterfabric-root-token}}
    depends_on:
      vault:
        condition: service_healthy

  tenant-runtime:
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN:-${VAULT_ROOT_TOKEN:-masterfabric-root-token}}
    depends_on:
      vault:
        condition: service_healthy

# =============================================================================
# VAULT VOLUMES
# =============================================================================

volumes:
  vault_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${VAULT_DATA_PATH:-./data/vault}
  vault_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${VAULT_LOG_PATH:-./logs/vault}
