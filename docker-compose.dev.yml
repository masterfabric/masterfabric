# Development Docker Compose Configuration
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  # Override services for development
  core-service:
    build:
      context: ./services/core-service
      dockerfile: Dockerfile
      target: dev
    volumes:
      - ./services/core-service:/app
      - /app/node_modules
      - /app/dist
    environment:
      NODE_ENV: development
    command: ["npm", "run", "start:dev"]

  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
      target: dev
    volumes:
      - ./services/api-gateway:/app
      - /app/node_modules
      - /app/dist
    environment:
      NODE_ENV: development
    command: ["npm", "run", "start:dev"]

  provisioning-service:
    build:
      context: ./services/provisioning-service
      dockerfile: Dockerfile
      target: dev
    volumes:
      - ./services/provisioning-service:/app
      - /app/node_modules
      - /app/dist
    environment:
      NODE_ENV: development
    command: ["npm", "run", "start:dev"]

  tenant-runtime:
    build:
      context: ./services/tenant-runtime
      dockerfile: Dockerfile
      target: dev
    volumes:
      - ./services/tenant-runtime:/app
      - /app/node_modules
      - /app/dist
    environment:
      NODE_ENV: development
    command: ["npm", "run", "start:dev"]

  dashboard:
    build:
      context: ./services/dashboard
      dockerfile: Dockerfile
      target: dev
    volumes:
      - ./services/dashboard:/app
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development
    command: ["npm", "run", "dev"]

  # Development tools
  prisma-studio:
    image: node:18-alpine
    container_name: masterfabric-prisma-studio
    working_dir: /app
    volumes:
      - ./services/core-service:/app
    ports:
      - "5555:5555"
    command: ["npx", "prisma", "studio", "--port", "5555"]
    depends_on:
      - postgres_core
    networks:
      - masterfabric-network
